name: "Go CI (Reusable)"

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory containing go.mod (relative to repo root)"
        required: false
        type: string
        default: "."
      go-version:
        description: "Go version to use (e.g. '1.23')"
        required: false
        type: string
        default: "1.23"
      run-sonar:
        description: "Upload coverage to SonarCloud"
        required: false
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        description: "SonarCloud token (required when run-sonar is true)"
        required: false
    outputs:
      coverage-artifact-id:
        description: "Artifact ID of the uploaded coverage report"
        value: ${{ jobs.build-test.outputs.coverage-artifact-id }}

permissions: {}

jobs:
  build-test:
    name: "Build and Test"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    outputs:
      coverage-artifact-id: ${{ steps.upload-coverage.outputs.artifact-id }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Set up Go"
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: "Build"
        run: go build -v ./...

      - name: "Test with coverage"
        run: go test -v ./... -coverprofile coverage.out

      - name: "Upload coverage report"
        id: upload-coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: ${{ inputs.working-directory }}/coverage.out
          retention-days: 7

      - name: "Upload coverage to SonarCloud"
        if: ${{ inputs.run-sonar == true }}
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4  # v7.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ inputs.working-directory }}
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.host.url=${{ vars.SONAR_HOST_URL }}
            -Dsonar.go.coverage.reportPaths=coverage.out
